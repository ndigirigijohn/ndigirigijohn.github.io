    <!--
      Anti-flash theme script — runs synchronously before React, before CSS paint.
      Priority: 1) saved localStorage preference  2) OS/system preference  3) light fallback
      Sets data-theme on <html> so CSS variables are correct on first paint.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-theme', saved);
          } else {
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
          }
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
