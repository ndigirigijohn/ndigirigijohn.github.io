  <rect class="bg" width="32" height="32" rx="6"/>
  <text class="fg" x="16" y="21.5" text-anchor="middle"
    font-family="ui-sans-serif,system-ui,-apple-system,sans-serif"
    font-size="13" font-weight="600" letter-spacing="-0.5">JN</text>
